<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida vs Melbourne – satellite, same scale</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
html,body{height:100%;margin:0;font:14px system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:#fff;border-bottom:1px solid #ccc}
h1{font-size:15px;margin:0;flex:1 1 100%}
label{display:flex;gap:6px;align-items:center;font-size:12px;color:#555}
#map{flex:1}
#info{position:absolute;z-index:1000;left:10px;bottom:28px;max-width:400px;background:#fffd;border-radius:8px;padding:8px 10px;font-size:12px}
.lbl{background:none;border:none;box-shadow:none;color:#ff7ab8;font-weight:700;text-shadow:0 0 3px #000,0 0 3px #000}
</style></head><body>
<header><h1>Leonida (GTA 6) vs Melbourne – satellite, same scale</h1>
<label>Leonida size <select id="est"><option value="85.6">85.6 km² · community map v16</option><option value="110">110 km² · earlier v15</option><option value="125">125 km² · larger estimate</option></select></label>
<label>Place on <select id="place"></select></label>
<label>Opacity <input id="op" type="range" min="15" max="100" value="55"></label></header>
<div id="map"></div><div id="info"></div>
<script>
const main=[[1,3],[5,2.5],[9,3.2],[11,2],[14,2.5],[16.5,3],[17,6],[16.5,8.5],[17.5,11],[18.5,14],[17.2,15.6],[15,13.2],[13.5,10.5],[12.5,12.5],[11,14.5],[9.5,13],[8.5,10],[6,9],[4,7.5],[2,6.5]];
const keys=[[[15.2,16.3],[16.6,16.8],[15.9,17.5]],[[13.2,17.3],[14.6,17.6],[13.9,18.2]],[[11.2,18],[12.6,18.3],[11.9,19]],[[9.2,18.7],[10.6,18.9],[9.9,19.5]],[[7.2,18.9],[8.6,19.1],[7.9,19.7]]];
const lab=[['Port Gellhorn',4,4.6],['Mount Kalaga NP',8.2,5.8],['Ambrosia',14.2,4.4],['Grassrivers',11.6,10.6],['Vice City',16,11.6],['Leonida Keys',11.5,17.2]];
const mel=[['Melbourne CBD',-37.8136,144.9631],['Footscray',-37.8,144.9],['St Kilda',-37.867,144.98],['Box Hill',-37.82,145.12],['Epping',-37.65,145.02],['Werribee',-37.9,144.66],['Dandenong',-37.987,145.215],['Frankston',-38.143,145.123],['Mornington',-38.22,145.04],['Sorrento',-38.34,144.74],['Geelong',-38.15,144.36]];
const area=p=>Math.abs(p.reduce((s,a,i)=>{const b=p[(i+1)%p.length];return s+a[0]*b[1]-b[0]*a[1]},0))/2;
const polys=[main,...keys],aU=polys.reduce((s,p)=>s+area(p),0),all=polys.flat();
const cU=[(Math.min(...all.map(a=>a[0]))+Math.max(...all.map(a=>a[0])))/2,(Math.min(...all.map(a=>a[1]))+Math.max(...all.map(a=>a[1])))/2];
const map=L.map('map',{zoomSnap:.25}).setView([-37.85,144.98],10.5);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics'}).addTo(map);
let C=L.latLng(-37.8136,144.9631),S=1,layers=[],handle;
// km offset (x east, y south) -> lat/lng around centre C (true metric scale)
const ll=(x,y)=>L.latLng(C.lat-y/110.95,C.lng+x/(111.32*Math.cos(C.lat*Math.PI/180)));
function draw(){layers.forEach(l=>map.removeLayer(l));layers=[];
 S=Math.sqrt(+est.value/aU);const op=+$op.value/100;
 const f=p=>p.map(([x,y])=>ll((x-cU[0])*S,(y-cU[1])*S));
 polys.forEach(p=>layers.push(L.polygon(f(p),{color:'#ff3d94',weight:2,fillColor:'#ff3d94',fillOpacity:op,interactive:false}).addTo(map)));
 lab.forEach(([n,x,y])=>layers.push(L.marker(ll((x-cU[0])*S,(y-cU[1])*S),{interactive:false,icon:L.divIcon({className:'lbl',html:n,iconSize:[120,16],iconAnchor:[60,8]})}).addTo(map)));
 const w=(Math.max(...all.map(a=>a[0]))-Math.min(...all.map(a=>a[0])))*S,h=(Math.max(...all.map(a=>a[1]))-Math.min(...all.map(a=>a[1])))*S;
 info.innerHTML=`<b>Leonida:</b> ~${est.value} km² land, box ≈ ${w.toFixed(1)} × ${h.toFixed(1)} km. Drag the pink handle to move it. Size is a fan estimate and the outline is stylised, not official.`;
 if(handle)handle.setLatLng(C)}
const $op=document.getElementById('op'),est=document.getElementById('est'),info=document.getElementById('info'),sel=document.getElementById('place');
mel.forEach(([n])=>sel.add(new Option(n,n)));
handle=L.marker(C,{draggable:true,title:'Drag Leonida'}).addTo(map);
handle.on('drag',e=>{C=e.target.getLatLng();draw()});
sel.onchange=()=>{const m=mel.find(a=>a[0]==sel.value);C=L.latLng(m[1],m[2]);draw();map.panTo(C)};
est.onchange=draw;$op.oninput=draw;draw();
</script></body></html>
